[project]
name = "ruleprobe"
version = "0.2.0"
description = "Mutation testing for LLM agent instruction files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "openai>=1.30",
    "anthropic>=0.28",
    "rich>=13.0",
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn>=0.30", "asyncpg>=0.29"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.4"]

[project.scripts]
ruleprobe = "ruleprobe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
