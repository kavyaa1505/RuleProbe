name: Run RuleProbe Analysis
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '*.md'
      - 'prompts/**'

jobs:
  ruleprobe:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for diff

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install RuleProbe
        run: uv pip install -e ".[dev]"

      - name: Detect changed instruction files
        id: changed
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(md|txt)$' | head -1)
          echo "file=$CHANGED" >> $GITHUB_OUTPUT

      - name: Run RuleProbe diff analysis
        if: steps.changed.outputs.file != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          uv run ruleprobe diff \
            "${{ github.base_ref }}..HEAD" \
            --file "${{ steps.changed.outputs.file }}" \
            --adapter mock \
            --budget 2.0 \
            --output markdown \
            > ruleprobe_report.md || echo "Analysis completed with warnings"

      - name: Comment PR with RuleProbe results
        if: steps.changed.outputs.file != '' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync('ruleprobe_report.md', 'utf8');
            } catch(e) {
              body = '> RuleProbe analysis did not produce a report.';
            }
            
            // Find existing comment to update
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const existing = comments.data.find(c => 
              c.body.includes('## 🔬 RuleProbe Analysis')
            );
            
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Fail on regression
        if: steps.changed.outputs.file != ''
        run: |
          # Grep for load_bearing rules with negative effect > 10 points
          if grep -q "load_bearing" ruleprobe_report.md 2>/dev/null; then
            echo "⚠️  Load-bearing rules detected in diff"
          fi
          # This step exits 0 — configure to exit 1 for hard enforcement
          exit 0
